<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 검색 사이트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #202124;
      padding: 20px;
    }
    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -2px;
    }
    .logo .b { color: #4285f4; }
    .logo .r { color: #ea4335; }
    .logo .y { color: #fbbc05; }
    .logo .g { color: #34a853; }
    form {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #dfe1e5;
      border-radius: 999px;
      padding: 14px 20px;
      box-shadow: 0 1px 6px rgba(32,33,36,0.15);
      transition: box-shadow 0.2s;
    }
    .search-box:focus-within {
      box-shadow: 0 1px 10px rgba(32,33,36,0.28);
      border-color: transparent;
    }
    .search-box svg { flex-shrink: 0; }
    input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      background: transparent;
    }
    .buttons {
      margin-top: 26px;
      display: flex;
      gap: 12px;
    }
    button {
      font-size: 0.9rem;
      padding: 10px 18px;
      border: 1px solid #f8f9fa;
      border-radius: 6px;
      background: #f8f9fa;
      color: #3c4043;
      cursor: pointer;
    }
    button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    footer {
      position: fixed;
      bottom: 16px;
      font-size: 0.8rem;
      color: #70757a;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="b">우</span><span class="r">웅</span><span class="y">수</span><span class="g">검색</span>
  </div>

  <form action="https://www.google.com/search" method="get" target="_blank">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
              stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input type="text" name="q" placeholder="검색어를 입력하세요" autofocus autocomplete="off" />
    </div>
    <div class="buttons">
      <button type="submit">검색</button>
      <button type="button" onclick="feelLucky()">오늘의 기분</button>
    </div>
  </form>

  <footer>내가 만든 검색 사이트 · Render로 배포됨</footer>

  <script>
    function feelLucky() {
      const q = document.querySelector('input[name="q"]').value.trim();
      if (q) {
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q) + "&btnI=1", "_blank");
      } else {
        window.open("https://www.google.com", "_blank");
      }
    }
  </script>
</body>
</html>
